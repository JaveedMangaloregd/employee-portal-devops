# AWS EXPLANATION:
# This pipeline migrates deployment from Heroku to AWS EC2.
# GitLab remains responsible for source control, testing, Docker builds and image storage.
# AWS EC2 will pull the Docker image from GitLab Container Registry and run the application.
# SSH is used by GitLab CI/CD to communicate with the EC2 instance.
# Configure EC2_HOST, EC2_USER and EC2_SSH_PRIVATE_KEY in GitLab CI/CD variables.

stages:
  - test
  - build
  - deploy staging
  #- release_staging
  - deploy feature
  - automated feature testing
  - automated testing
  - deploy production


variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE/employee-image:$CI_COMMIT_SHORT_SHA    #$CI_COMMIT_REF_SLUG SHOT SHA MAKESTAG IMAGE IN DIFFERENT WAY TO KEEP HISTORY IMAGE TO SOLVE ROLLBACK

  # AWS EXPLANATION:
  # These are Docker container names on the EC2 instance.
  # Staging and production run as separate containers.
  STAGING_CONTAINER: employee-portal-staging
  PRODUCTION_CONTAINER: employee-portal-production

  # AWS EXPLANATION:
  # Staging is exposed through EC2 port 8081.
  # Production is exposed through EC2 port 80.
  STAGING_PORT: "8081"
  PRODUCTION_PORT: "80"

  # FEATURE_APP: $CI_ENVIRONMENT_SLUG   #DYNAMIC ENV  gitlab env do no not resolve when u use var1 in var2 so we use this and herofeature directly in deploy feature stage
  # HEROKU_FEATURE: "registry.heroku.com/$FEATURE_APP/web"

# AWS EXPLANATION:
# GitLab runs Python linting before building or deploying the application.
# This job is retained from your original pipeline.
lint_test:
  image: python:3.8.0-slim
  stage: test
  before_script:
    - pip install flake8-html
  script:
    - flake8 --format=html --htmldir=flake_reports/
  artifacts:
    when: always
    paths:
      - flake_reports/

# AWS EXPLANATION:
# Runs the existing pytest test suite.
# No application test code is changed as part of this migration.
pytest:
  image: python:3.8.0-slim
  stage: test
  before_script:
    - pip install pytest-html
    - pip install -r requirements.txt
  script:
    - pytest --html=pytest_reports/pytest-report.html --self-contained-html
  artifacts:
    when: always
    paths:
      - pytest_reports/

# AWS EXPLANATION:
# Docker builds the Employee Portal image.
# The image is pushed to GitLab Container Registry.
# EC2 will pull this same image during deployment.
# No AWS ECR repository is required.
# you can add this build stage after Procfile is made
build:
  image: docker:latest
  services:
    - docker:dind #docker image that runs in linked manner with a parent docker so dind is child image of docker where it generates TLS cert automatically
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" #U- USERNAME P- PASSWORD
  script:
    - docker build -t $IMAGE_TAG . # EVERYTHING IS MOVED TO GLOBAL VARIABLE
    - docker images
    - docker push $IMAGE_TAG
    #<registry URL>/<namespace>/<project>/<image> user name is gitlab username
    # $CI_COMMIT_REF_SLUG = app-logic
    # - docker build -t $CI_REGISTRY_IMAGE/employee-image:$CI_COMMIT_REF_SLUG
    # $CI_REGISTRY_IMAGE ="registry.gitlab.com/jav_kai/employee-portal"


#DYNAMIC ENV

# AWS EXPLANATION:
# Each feature branch gets its own Docker container on EC2.
# FEATURE_APP identifies the container.
# FEATURE_PORT determines the host port used to access that feature environment.
# The image is pulled from GitLab Container Registry.
# The EC2 instance must allow access to the feature port range.
deploy_feature:
  image: alpine:3.20
  stage: deploy feature
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: http://$EC2_HOST:$FEATURE_PORT/
    on_stop: stop-feature
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
    - export FEATURE_APP="$CI_ENVIRONMENT_SLUG"
    - export FEATURE_PORT=$((10000 + CI_PIPELINE_IID % 50000))
  script:
    - echo "FEATURE_APP=$CI_ENVIRONMENT_SLUG" >> deploy_feature.env
    - echo "FEATURE_PORT=$FEATURE_PORT" >> deploy_feature.env
    - |
      ssh "$EC2_USER@$EC2_HOST" "
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        docker pull '$IMAGE_TAG'
      "
    - |
      ssh "$EC2_USER@$EC2_HOST" "
        docker stop '$FEATURE_APP' || true
        docker rm '$FEATURE_APP' || true
        docker run -d \
          --name '$FEATURE_APP' \
          --restart unless-stopped \
          -p '$FEATURE_PORT:5000' \
          -e PORT=5000 \
          '$IMAGE_TAG'
      "
    - echo "App deployed to FEATURE server at http://$EC2_HOST:$FEATURE_PORT/"
  artifacts:
    reports:
      dotenv: deploy_feature.env
    #this should only work for the feature branch:
  only:
    - /^feature-.*$/

# AWS EXPLANATION:
# Stops and removes the feature container from EC2.
# It does not terminate or delete the EC2 instance.
stop-feature:
  image: alpine:3.20
  stage: deploy feature
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
    - export FEATURE_APP="$CI_ENVIRONMENT_SLUG"
  script:
    - ssh "$EC2_USER@$EC2_HOST" "docker stop '$FEATURE_APP' || true; docker rm '$FEATURE_APP' || true"
    - echo "FEATURE application at server http://$EC2_HOST/ is destroyed"
  when: manual
  only:
    - /^feature-.*$/

# AWS EXPLANATION:
# Tests the feature application using its EC2 public IP and dynamically assigned port.
test_feature:
  image: alpine:3.20
  stage: automated feature testing
  before_script:
    - apk --no-cache add curl
  script:
    - curl --fail "http://$EC2_HOST:$FEATURE_PORT/" | grep "Employee Data"
  dependencies:
    - deploy_feature # find jobs from stage executed before the current one
    # if artifacts of job set as dependencies unexpired or deleted than dependent job fails
  only:
    - /^feature-.*$/

#Cd deployment stage

# AWS EXPLANATION:
# Deploys the staging image to the AWS EC2 instance.
# The EC2 Docker daemon pulls the image from GitLab Container Registry.
# The previous staging container is stopped and replaced.
# Staging is accessible through port 8081.
deploy_stage:
  image: alpine:3.20
  stage: deploy staging
  tags:
    - aws-ec2
  environment:
    name: staging
    url: http://$EC2_HOST:8081/
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keygen -y -f ~/.ssh/id_rsa > /tmp/ci_deploy.pub
    - ssh-keygen -lf /tmp/ci_deploy.pub
    - echo "Checking EC2 host variable..."
    - 'test -n "$EC2_HOST" || (echo "ERROR: EC2_HOST is empty"; exit 1)'
    - echo "EC2_HOST is available"
    - apk add --no-cache netcat-openbsd
    - echo "Testing SSH connectivity to EC2..."
    - nc -vz -w 5 "$EC2_HOST" 22
    - ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$EC2_USER@$EC2_HOST" "
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        docker pull '$IMAGE_TAG'
      "
    - |
      ssh "$EC2_USER@$EC2_HOST" "
        docker stop '$STAGING_CONTAINER' || true
        docker rm '$STAGING_CONTAINER' || true
        docker run -d \
          --name '$STAGING_CONTAINER' \
          --restart unless-stopped \
          -p 8081:5000 \
          -e PORT=5000 \
          -v employee-portal-db:/app/instance \
          '$IMAGE_TAG' &&
        sleep 3 &&
        docker exec '$STAGING_CONTAINER' python -c 'from app import app, db; ctx=app.app_context(); ctx.push(); db.create_all()'
      "
    - echo "App deployed to staging server at http://$EC2_HOST:8081/"
   # registry.heroku.com/emp-portal-staging/web # emp-portal-staging is the new app repo name of heroku u supposed to put
   # MOVED TO GLOBAL VARIABLE
  only:
    - main

