# AWS EXPLANATION:
# Sends an HTTP request to the staging application on EC2.
# The job succeeds if the expected Employee Data text is present.
test_stage:
  image: alpine:3.20
  stage: automated testing
  tags:
    - aws-ec2
  before_script:
    - apk --no-cache add curl
  script:
    - curl --fail "http://$EC2_HOST:8081/" | grep "Employee Data"
  only:
    - main

#deployment production

# AWS EXPLANATION:
# Deploys the production container on EC2.
# Production uses port 80.
# Staging and production use different Docker container names.
deploy_production:
  image: alpine:3.20
  stage: deploy production
  tags:
    - aws-ec2
  environment:
    name: production
    url: http://$EC2_HOST/
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$EC2_USER@$EC2_HOST" "
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        docker pull '$IMAGE_TAG'
      "
    - |
      ssh "$EC2_USER@$EC2_HOST" "
        docker stop '$PRODUCTION_CONTAINER' || true
        docker rm '$PRODUCTION_CONTAINER' || true
        docker run -d \
          --name '$PRODUCTION_CONTAINER' \
          --restart unless-stopped \
          -p 80:5000 \
          -e PORT=5000 \
          -v employee-portal-production-db:/app/instance \
          '$IMAGE_TAG' &&
        sleep 3 &&
        docker exec '$PRODUCTION_CONTAINER' python -c 'from app import app, db; ctx=app.app_context(); ctx.push(); db.create_all()'
      "
    - echo "App deployed to production server at http://$EC2_HOST/"
  only:
    - main # only makes the main when other branches is merged to main so it deploys only that time  
 # when: manual #trigger manual deploy

